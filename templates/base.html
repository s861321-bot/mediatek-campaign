<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#911e2a"><title>{% block title %}聯發科紅白對抗賽{% endblock %}</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');
:root{font-family:'Noto Sans TC',system-ui,sans-serif;color:#272225;background:#f8f4f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f8f4f0}body:before{content:'';display:block;height:7px;background:linear-gradient(90deg,#a72232 0 50%,#ded8d1 50% 100%)}.stage{height:300px;background:linear-gradient(132deg,#5b1220,#ae2538 57%,#c8484c);position:absolute;z-index:0;left:0;right:0;top:7px;overflow:hidden}.stage:before{content:'RED  /  WHITE';position:absolute;left:-4%;top:-42px;font-size:clamp(100px,19vw,280px);font-weight:900;letter-spacing:-12px;color:#fff;opacity:.055;white-space:nowrap}.stage:after{content:'';position:absolute;right:-65px;top:-100px;width:300px;height:470px;border:58px solid #fff;transform:rotate(28deg);opacity:.10}main{position:relative;width:min(92%,650px);margin:0 auto;padding:43px 0 55px}.mast{text-align:center;color:white}.small{letter-spacing:.32em;font-size:12px;font-weight:800;color:#efd4bf}.mast h1{font-size:clamp(30px,6vw,48px);letter-spacing:.045em;margin:17px 0 7px;font-weight:900;line-height:1.3}.mast .sub{font-size:16px;letter-spacing:.12em;color:#fae6e1}.event-line{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:19px;color:#f5d9d4;font-size:12px;letter-spacing:.17em}.event-line:before,.event-line:after{content:'';width:45px;height:1px;background:#d99a9e}.card{position:relative;background:#fff;border-radius:24px;padding:35px 38px;box-shadow:0 20px 60px #38162014;margin-top:34px}.section{font-weight:900;font-size:11px;letter-spacing:.20em;color:#b02c3b;text-transform:uppercase}.card h2{font-size:24px;line-height:1.5;letter-spacing:.01em;margin:10px 0 23px}.divider{height:1px;background:#eee5e0;margin:28px 0}.choices{display:grid;gap:12px}.choice{display:flex;align-items:center;gap:12px;padding:18px 17px;border:1.5px solid #eae4e0;border-radius:14px;cursor:pointer;transition:.2s;background:white}.choice:hover{border-color:#ad3542;background:#fffbfa}.choice:has(input:checked){border-color:#ad2536;background:#fff5f5;box-shadow:inset 0 0 0 1px #ad2536}.choice input{accent-color:#ad2536;width:19px;height:19px;flex-shrink:0}.choice b{font-size:17px}.choice span{font-size:14px}.fields{display:grid;gap:17px;margin-top:15px}.fields label{font-size:14px;font-weight:700}.fields input{display:block;margin-top:8px;width:100%;padding:15px 16px;border:1.5px solid #e5ded9;border-radius:11px;font-size:16px;font-family:inherit;outline:none;background:#fff}.fields input:focus{border-color:#a72938;box-shadow:0 0 0 3px #a7293811}.notice{background:#faf7f4;padding:15px 17px;border-radius:11px;font-size:12px;line-height:1.9;color:#746d69;margin:23px 0 16px}.notice b{color:#463f3c}.agree{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#544c49;line-height:1.6}.agree input{accent-color:#a72b35;margin-top:4px}.primary,button,.btn{font-family:inherit;background:#aa2737;color:white;border:none;border-radius:12px;font-size:15px;font-weight:800;padding:15px 19px;cursor:pointer;text-decoration:none;display:inline-block}.primary{margin-top:22px;width:100%;font-size:17px;letter-spacing:.03em;box-shadow:0 7px 19px #96263328}.primary:hover,.btn:hover,button:hover{background:#891d2a}.foot{text-align:center;color:#9b918a;font-size:12px;margin-top:27px}.flash{padding:13px;background:#fff1f0;border-radius:9px;color:#9f2030;margin:14px 0}.center{text-align:center}.ticket{margin:28px 0;padding:28px 12px;border:2px dashed #d9bab5;border-radius:20px;background:linear-gradient(145deg,#fff8ee,#fff1f2)}.ticket .no{font-size:clamp(60px,15vw,90px);font-weight:900;color:#a42838;letter-spacing:.13em;line-height:1.45}.muted{color:#867b77;font-size:13px}.admin-main{width:min(94%,1100px)}.admin-main .mast{text-align:left}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:18px}.admin-top .mast h1{font-size:32px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat{background:#fbf5f2;border-radius:13px;padding:22px 13px;text-align:center;color:#746763;font-size:13px}.stat strong{display:block;font-size:34px;color:#a62435;margin-top:5px}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0}.tools input,.tools select{font:inherit;border:1px solid #e7dfd9;border-radius:9px;padding:11px 12px;font-size:14px}.tools input{flex:1;min-width:180px}.tools button,.tools .btn{font-size:13px;padding:12px 14px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;white-space:nowrap;padding:14px 12px;border-bottom:1px solid #eee7e3}th{background:#faf7f5;color:#6b5e5b}.logout{background:transparent;border:1px solid #ffffff80;color:white}.logout:hover{background:#ffffff22}.reveal{background:#f4e7e7;color:#8e2835;font-size:12px;padding:5px 9px;margin-left:5px}.pill{background:#fbe9e8;color:#a52232;padding:4px 9px;border-radius:100px;font-size:12px}a{color:#a52637}@media(max-width:620px){.stage{height:277px}main{padding-top:35px}.mast h1{font-size:30px}.card{padding:25px 22px;border-radius:19px;margin-top:33px}.card h2{font-size:21px}.choice{padding:15px 12px}.choice span{font-size:13px}.stats{gap:7px}.stat{padding:16px 5px;font-size:11px}.stat strong{font-size:24px}.admin-main .mast h1{font-size:25px}.ticket .no{letter-spacing:.08em}}
</style></head><body><div class="stage" aria-hidden="true"></div>{% block body %}{% endblock %}</body></html>
